<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">ETOT — Jonio Extended Text On Terminal</title>
<desc id="hero-desc">Logo ETOT rosso accanto a una finestra illustrativa dell'editor su fondo scuro.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101724"/><stop offset=".55" stop-color="#171d31"/><stop offset="1" stop-color="#0c1322"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4655"/><stop offset="1" stop-color="#8faaff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#e40019" stop-opacity=".24"/><stop offset="1" stop-color="#e40019" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<circle cx="220" cy="140" r="260" fill="url(#glow)"/>
<g opacity=".13" stroke="#8faaff" stroke-width="1"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M80 0V460M160 0V460M240 0V460M320 0V460M400 0V460M480 0V460M560 0V460"/></g>
<path d="M0 0H1200" stroke="url(#edge)" stroke-width="5"/>
<g transform="translate(63 71) scale(.25) translate(-220 -84)">
<title id="title">ETOT — editor di testo</title>
<desc id="desc">Logo tipografico geometrico rosso con diagonali alternate in sequenza su, giù, su, giù.</desc>
