[package]
name = "etot-rs"
version = "0.1.0"
edition = "2021"
description = "Jonio Extended Text On Terminal, an independent Rust editor"

[[bin]]
name = "etot"
path = "src/main.rs"

[dependencies]
tempfile = "3"
regex = "1"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-vb-dotnet = "0.1"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
signal-hook = "0.3"
libc = "0.2"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
portable-pty = "0.9"
vt100 = "0.18"

[[bench]]
name = "large_file"
harness = false
